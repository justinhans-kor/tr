<!doctype html><html lang="ko"><head><title>페이지 없음</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#F2F2EC;--card:#fff;--ink:#1B1B17;--ink-2:#5C5C52;--ink-3:#8B8B7E;--line:#D9D9CF;--acc:#E0B100;--acc-ink:#6B5400}
@media(prefers-color-scheme:dark){:root{--bg:#141410;--card:#1D1D17;--ink:#EDEBE0;--ink-2:#B0AE9F;--ink-3:#7E7C70;--line:#33322A;--acc:#F2C630;--acc-ink:#F2C630}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.7}
#g{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.card{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--acc);max-width:520px;width:100%;padding:34px}
.eb{display:flex;justify-content:space-between;color:var(--ink-3);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}.eb b{font-family:monospace;color:var(--acc-ink);font-size:15px}
h1{font-size:24px;line-height:1.3;margin:14px 0 8px}p{margin:0;color:var(--ink-2)}
form{display:grid;gap:12px;margin-top:22px}
label{display:grid;gap:6px;font-size:13px;color:var(--ink-3);letter-spacing:.04em}
input{font:inherit;font-family:"IBM Plex Mono",monospace;font-size:22px;letter-spacing:.1em;text-align:center;
  padding:14px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:none;border-color:var(--acc)}
button{font:inherit;font-weight:600;font-size:17px;padding:15px;border:0;border-radius:6px;background:var(--acc);color:#1B1B17;cursor:pointer}
.hint{margin-top:14px;font-size:13px;color:var(--ink-3)}
.err{margin-top:12px;font-size:14px;color:#A8321F}</style></head><body><div id="g"><main class="card"><div class="eb"><span>Transformer Site Test Record</span><b></b></div><h1>그 번호의 페이지가 없습니다</h1><p>아직 발행하지 않은 번호이거나 주소가 잘못됐습니다. 판에 새겨진 번호를 다시 넣어 보세요.</p><form id="f" autocomplete="off">
  <label>기록판 번호<input id="n" inputmode="numeric" placeholder="001" maxlength="4" required autofocus></label>
  <button type="submit">성적서 열기</button>
</form>
<p class="hint">판 오른쪽 위의 「No. 001」 에서 숫자만 넣으면 됩니다. 1 · 01 · 001 다 됩니다.</p>
<div id="m"></div>
<script>
document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var v = document.getElementById('n').value.replace(/[^0-9]/g, '');
  if (!v) { document.getElementById('m').innerHTML = '<p class="err">번호를 넣어 주세요.</p>'; return; }
  location.href = '/tr/' + ('00' + v).slice(-3) + '/';
});
</script></main></div></body></html>
