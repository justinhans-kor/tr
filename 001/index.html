<script>
(function(){
  var B = JSON.parse(document.getElementById('blob').textContent);
  var norm = function(s){ return s.toLowerCase().replace(/[^0-9a-z]/g,''); };
  var normSn = function(s){ return norm(s).slice(-4); };
  var normDt = function(s){ var d = s.replace(/[^0-9]/g,''); return d.length===6 ? '20'+d : d; };
  var b64 = function(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; };
  var f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
  f.addEventListener('submit', async function(e){
    e.preventDefault(); msg.innerHTML=''; go.disabled = true; go.textContent = '확인 중…';
    try {
      var pw = normDt(document.getElementById('dt').value);
      var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(B.salt), iterations:B.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var html = null, pdf = null;
      if (B.ct)  html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(B.iv)}, key, b64(B.ct)));
      if (B.pct) pdf  = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(B.piv)}, key, b64(B.pct));
      document.getElementById('gate').style.display = 'none';
      if (B.dl) document.getElementById('dl').style.display = 'block';
      if (html) show(html);
      if (pdf)  await showPdf(new Uint8Array(pdf));
    } catch (err) {
      msg.innerHTML = '<div class="err">맞지 않습니다. 판에 적힌 시험일을 다시 확인해 주세요.</div>';
      go.disabled = false; go.textContent = '열기';
    }
  });
  function show(html){
    // 요약이 완전한 문서면 <head> 의 style/link 와 <body> 속만 옮겨 심는다
    var doc = document.getElementById('doc');
    var m = /<body[^>]*>([\s\S]*)<\/body>/i.exec(html);
    var head = /<head[^>]*>([\s\S]*)<\/head>/i.exec(html);
    var styles = '';
    if (head) { var t = document.createElement('div'); t.innerHTML = head[1];
      t.querySelectorAll('style,link[rel="stylesheet"]').forEach(function(n){ styles += n.outerHTML; }); }
    doc.innerHTML = styles + (m ? m[1] : html);
    var tt = /<title>([\s\S]*?)<\/title>/i.exec(html); if (tt) document.title = tt[1];
    doc.style.display = 'block';
    doc.querySelectorAll('script').forEach(function(s){ var n = document.createElement('script'); n.textContent = s.textContent; s.replaceWith(n); });
  }
  async function showPdf(bytes){
    var wrap = document.getElementById('pdfwrap'), pages = document.getElementById('pages');
    wrap.style.display = 'block';
    if (!window.pdfjsLib) { pages.textContent = 'PDF 표시 모듈을 불러오지 못했습니다.'; return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var doc = await pdfjsLib.getDocument({data: bytes}).promise;
    var scale = Math.min(2, (Math.min(window.innerWidth, 900) - 32) / 595 * window.devicePixelRatio);
    for (var i = 1; i <= doc.numPages; i++) {
      var page = await doc.getPage(i), vp = page.getViewport({scale: scale});
      var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      pages.appendChild(c);
      var no = document.createElement('div'); no.className = 'pgno'; no.textContent = i + ' / ' + doc.numPages; pages.appendChild(no);
      await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
    }
  }
})();
</script>
